# ── Pet Licence Factory — Cloudflare Pages Config ──────────────────────
name = "pet-licence-factory"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Non-secret env vars (secrets set via dashboard or `wrangler pages secret put`)
[vars]
URL = "https://petlicensefactory.com"
# Branded transactional sender (petlicensefactory.com domain-authenticated in
# SendGrid 2026-06). From name defaults to "Pet Licence Factory"; replies route
# to contact@creditcardart.com (see functions/_shared/email.js).
SENDGRID_FROM_EMAIL = "hello@petlicensefactory.com"
# TikTok Pixel "Pet Licence Factory Web" — public client-side ID, served to the
# browser via /api/pixels-config → public/pixels.js. Not a secret. Set META_PIXEL_ID
# here too if/when we run Meta ads.
TIKTOK_PIXEL_ID = "D98M0S3C77UDPAPRKQT0"

# Hyperdrive binding for AWS RDS PostgreSQL
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "ab7308b07e2448f18af81c0a1169a3cb"

# Private R2 bucket for creator review video uploads
[[r2_buckets]]
binding = "CREATOR_UPLOADS"
bucket_name = "pet-licence-factory-creator-uploads"
